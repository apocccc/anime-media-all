<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 235" width="220" height="235" preserveAspectRatio="xMaxYMax meet">
  <!-- TODO: 正式なコミュニティ枠キャラクター素材に差し替える。右下 220 × 235 pxの表示領域は維持すること。 -->
