      <path d="M92 128 q12 -8 24 0 l-2 20 q-10 8 -20 0 Z" fill="#fffdf9"/>
      <circle cx="104" cy="138" r="7" fill="#8a5c3b"/>
      <circle cx="102" cy="135" r="2.5" fill="#fffdf9" stroke="none"/>
