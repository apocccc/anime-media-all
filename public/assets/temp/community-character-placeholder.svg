    <path d="M66 128 Q58 70 110 56 Q160 46 176 96 Q182 116 176 132 Q168 100 148 96 Q156 116 150 130 Q138 96 112 96 Q118 116 110 130 Q96 98 78 106 Q82 120 76 134 Z" fill="#f48fa4"/>
