    <circle cx="168" cy="222" r="7" fill="#fad157" stroke-width="3"/>
    <!-- 目 -->
    <g stroke-width="3.5">
      <path d="M188 206 q16 -10 32 0 l-2 26 q-14 10 -28 0 Z" fill="#fffdf9"/>
      <path d="M256 206 q16 -10 32 0 l-2 26 q-14 10 -28 0 Z" fill="#fffdf9"/>
